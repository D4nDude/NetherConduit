services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "25565:25565"
    environment:
      - DEFAULT_SERVER=server
      - DEFAULT_SERVER_PORT=25565
  
  backend:
    container_name: server
    image: itzg/minecraft-server:latest
    pull_policy: daily
    tty: true
    stdin_open: true
    environment:
      EULA: "TRUE"
    volumes:
      - "./minecraft-server:/data"
