[package]
name = "netherconduit"
version = "0.1.0"
edition = "2024"

[features]
debug = []
tokio-console = ["debug", "dep:console-subscriber"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
bytes = "1.12.1"
console-subscriber = { version = "0.5.0", optional = true }
futures = "0.3.33"
log = "0.4.33"
netherconduit-core = { version = "0.1.0", path = "../netherconduit-core" }
simple_logger = "5.2.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.19", features = ["codec"] }
uuid = { version = "1.26.0", features = ["v4", "v8"] }
