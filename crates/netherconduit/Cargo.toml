[package]
name = "netherconduit"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
futures = "0.3.33"
log = "0.4.33"
netherconduit-core = { version = "0.1.0", path = "../netherconduit-core" }
simple_logger = "5.2.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.19", features = ["codec"] }
uuid = { version = "1.26.0", features = ["v8"] }
